<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khôi phục mật khẩu - FoodHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#ab3500",
            "primary-container": "#ff6b35",
            "on-primary": "#ffffff",
            surface: "#f9f9ff",
            "on-surface": "#151c27",
            "on-surface-variant": "#594139",
            secondary: "#5f5e5e",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f0f3ff",
            "surface-container": "#e7eefe",
            "surface-container-high": "#e2e8f8"
          },
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen flex flex-col justify-between">
  <header></header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="max-w-md w-full bg-surface-container-lowest border border-surface-container-high rounded-3xl p-6 sm:p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-primary-container text-white items-center justify-center shadow-md shadow-primary/20 mb-3">
          <span class="material-symbols-outlined text-[26px]">lock_reset</span>
        </div>
        <h1 class="text-2xl font-black text-on-surface tracking-tight">Khôi phục mật khẩu</h1>
        <p class="text-xs text-secondary mt-1">Lấy lại quyền truy cập tài khoản FoodHub của bạn</p>
      </div>

      <!-- Error / Success Alert Box -->
      <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2"></div>

      <!-- STEP 1: Request Reset Token -->
      <div id="step-request-token">
        <p class="text-xs text-secondary mb-4 leading-relaxed">
          Nhập địa chỉ email đã đăng ký. Hệ thống sẽ tạo mã xác thực an toàn để bạn đặt lại mật khẩu mới.
        </p>

        <form id="forgot-form" class="space-y-4">
          <div>
            <label for="forgot-email" class="block text-xs font-bold text-on-surface mb-1">Email tài khoản:</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">mail</span>
              <input
                id="forgot-email"
                type="email"
                required
                placeholder="example@foodhub.vn"
                class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
              />
            </div>
          </div>

          <button
            id="request-token-btn"
            type="submit"
            class="w-full h-11 rounded-xl bg-primary-container hover:bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all cursor-pointer"
          >
            <span>Tạo mã đặt lại mật khẩu</span>
            <span class="material-symbols-outlined text-[18px]">key</span>
          </button>
        </form>
      </div>

      <!-- STEP 2: Enter Token and New Password -->
      <div id="step-reset-password" class="hidden space-y-4">
        <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs">
          <p class="font-bold">Mã xác thực của bạn:</p>
          <p id="generated-token-display" class="font-mono text-[11px] break-all bg-white p-2 rounded mt-1 select-all border border-amber-200"></p>
        </div>

        <form id="reset-form" class="space-y-4">
          <input type="hidden" id="reset-token-input" />

          <div>
            <label for="new-password" class="block text-xs font-bold text-on-surface mb-1">Mật khẩu mới (tối thiểu 6 ký tự):</label>
            <input
              id="new-password"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full h-11 px-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>

          <div>
            <label for="confirm-new-password" class="block text-xs font-bold text-on-surface mb-1">Xác nhận mật khẩu mới:</label>
            <input
              id="confirm-new-password"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full h-11 px-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>

          <button
            id="reset-submit-btn"
            type="submit"
            class="w-full h-11 rounded-xl bg-primary-container hover:bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all cursor-pointer"
          >
            <span>Cập nhật mật khẩu mới</span>
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
          </button>
        </form>
      </div>

      <div class="mt-6 text-center text-xs text-secondary">
        <a href="/login.html" class="font-bold text-primary hover:text-primary-container transition-colors inline-flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px]">arrow_back</span>
          <span>Quay lại trang Đăng nhập</span>
        </a>
      </div>
    </div>
  </main>

  <footer></footer>

  <script type="module" src="/src/forgotPassword.js"></script>
</body>
</html>
