<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản - FoodHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#ab3500",
            "primary-container": "#ff6b35",
            "on-primary": "#ffffff",
            surface: "#f9f9ff",
            "on-surface": "#151c27",
            "on-surface-variant": "#594139",
            secondary: "#5f5e5e",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f0f3ff",
            "surface-container": "#e7eefe",
            "surface-container-high": "#e2e8f8"
          },
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen flex flex-col justify-between">
  <header></header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="max-w-md w-full bg-surface-container-lowest border border-surface-container-high rounded-3xl p-6 sm:p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-white items-center justify-center shadow-md shadow-primary/20 mb-3">
          <span class="material-symbols-outlined text-[26px]">person_add</span>
        </div>
        <h1 class="text-2xl font-black text-on-surface tracking-tight">Tạo tài khoản mới</h1>
        <p class="text-xs text-secondary mt-1">Gia nhập cộng đồng sành ăn FoodHub ngay hôm nay</p>
      </div>

      <!-- Error Box -->
      <div id="register-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span id="register-error-text"></span>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-4">
        <div>
          <label for="name" class="block text-xs font-bold text-on-surface mb-1">Họ và tên:</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">badge</span>
            <input
              id="name"
              type="text"
              required
              placeholder="Nguyễn Văn A"
              class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-xs font-bold text-on-surface mb-1">Địa chỉ Email:</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">mail</span>
            <input
              id="email"
              type="email"
              required
              placeholder="name@example.com"
              class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>
        </div>

        <div>
          <label for="phone" class="block text-xs font-bold text-on-surface mb-1">Số điện thoại (tùy chọn):</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">call</span>
            <input
              id="phone"
              type="tel"
              placeholder="0912345678"
              class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-on-surface mb-1">Mật khẩu (tối thiểu 6 ký tự):</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">lock</span>
            <input
              id="password"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full h-11 pl-10 pr-10 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
            <button
              id="toggle-pwd-btn"
              type="button"
              class="absolute right-3 top-3 text-secondary hover:text-on-surface transition-colors cursor-pointer"
            >
              <span class="material-symbols-outlined text-[18px]">visibility</span>
            </button>
          </div>
        </div>

        <div>
          <label for="confirm-password" class="block text-xs font-bold text-on-surface mb-1">Xác nhận mật khẩu:</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-secondary text-[18px]">verified</span>
            <input
              id="confirm-password"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-surface-container-high rounded-xl text-xs text-on-surface placeholder:text-secondary focus:outline-none focus:border-primary-container focus:bg-surface-container-lowest transition-all"
            />
          </div>
        </div>

        <button
          id="register-submit-btn"
          type="submit"
          class="w-full h-11 mt-2 rounded-xl bg-primary-container hover:bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all cursor-pointer"
        >
          <span>Đăng ký ngay</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-secondary">
        Đã có tài khoản?
        <a href="/login.html" class="font-bold text-primary hover:text-primary-container transition-colors ml-1">Đăng nhập ngay</a>
      </div>
    </div>
  </main>

  <footer></footer>

  <script type="module" src="/src/register.js"></script>
</body>
</html>
